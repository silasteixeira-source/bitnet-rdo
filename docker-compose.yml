services:
  # Robô 1: Omada Exporter (Baixa a planilha do Omada Cloud Controller)
  omada-exporter:
    build: ./omada
    container_name: rdo_omada_exporter
    restart: unless-stopped
    shm_size: '2gb'
    # Limites de recursos para proteção da VPS
    deploy:
      resources:
        limits:
          cpus: '0.80'
          memory: 1G
        reservations:
          memory: 256M
    # Limitação de logs no disco da VPS (máximo 30MB por container)
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      - TZ=America/Sao_Paulo
      - OMADA_CLI=true
      - OMADA_EMAIL=${OMADA_EMAIL:-noceace@bitinternet.com.br}
      - OMADA_PASSWORD=${OMADA_PASSWORD:-""}
      - OMADA_INTERVAL=300
      - OMADA_DIR=/app/dados_omada
    volumes:
      - ./omada/dados_omada:/app/dados_omada
    command: ["python", "-u", "omada_exporter_cli.py", "--cli", "--interval", "300"]

  # Robô 2: EACE OS Exporter (Baixa a planilha RI do portal EACE e dispara o cruzamento do Unificador)
  eace-os-exporter:
    build:
      context: .
      dockerfile: eace/Dockerfile
    container_name: rdo_eace_os_exporter
    restart: unless-stopped
    shm_size: '2gb'
    # Limites de recursos para proteção da VPS
    deploy:
      resources:
        limits:
          cpus: '0.80'
          memory: 1G
        reservations:
          memory: 256M
    # Limitação de logs no disco da VPS (máximo 30MB por container)
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      - TZ=America/Sao_Paulo
      - EACE_EMAIL=${EACE_EMAIL:-noc@bitinternet.com.br}
      - EACE_PASSWORD=${EACE_PASSWORD:-""}
      - EACE_INTERVAL=${EACE_INTERVAL:-300}
    volumes:
      - ./eace/dados_eace:/app/dados_eace
      - ./omada/dados_omada:/app/omada/dados_omada
      - ./.streamlit:/app/.streamlit
    command: ["python", "-u", "eace_os_exporter.py", "--intervalo", "300"]
