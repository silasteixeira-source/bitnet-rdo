services:
  # Robô 1: Omada Exporter (Baixa a planilha do Omada Cloud Controller)
  omada-exporter:
    build: ./omada
    container_name: rdo_omada_exporter
    restart: unless-stopped
    shm_size: '2gb'
    # Limites de recursos para proteção da VPS
    deploy:
      resources:
        limits:
          cpus: '0.80'
          memory: 1.5G
        reservations:
          memory: 256M
    # Limitação de logs no disco da VPS (máximo 30MB por container)
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      - TZ=America/Sao_Paulo
      - OMADA_CLI=true
      - OMADA_EMAIL=${OMADA_EMAIL:-noceace@bitinternet.com.br}
      - OMADA_PASSWORD=${OMADA_PASSWORD:-""}
      - OMADA_ST1_EMAIL=${OMADA_ST1_EMAIL:-""}
      - OMADA_ST1_PASSWORD=${OMADA_ST1_PASSWORD:-""}
      - OMADA_INTERVAL=300
      - OMADA_DIR=/app/dados_omada
    volumes:
      - ./omada/dados_omada:/app/dados_omada
      - ./omada/dados_st1:/app/dados_st1_omada
    command: ["python", "-u", "omada_exporter_cli.py", "--cli", "--interval", "300"]

  # Robô 2: EACE OS Exporter (Baixa a planilha RI do portal EACE e dispara o cruzamento do Unificador)
  eace-os-exporter:
    build:
      context: .
      dockerfile: eace/Dockerfile
    container_name: rdo_eace_os_exporter
    restart: unless-stopped
    shm_size: '2gb'
    # Limites de recursos para proteção da VPS
    deploy:
      resources:
        limits:
          cpus: '0.80'
          memory: 1.5G
        reservations:
          memory: 256M
    # Limitação de logs no disco da VPS (máximo 30MB por container)
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      - TZ=America/Sao_Paulo
      - EACE_EMAIL=${EACE_EMAIL:-noc@bitinternet.com.br}
      - EACE_PASSWORD=${EACE_PASSWORD:-""}
      - EACE_ST1_EMAIL=${EACE_ST1_EMAIL:-""}
      - EACE_ST1_PASSWORD=${EACE_ST1_PASSWORD:-""}
      - EACE_INTERVAL=${EACE_INTERVAL:-300}
    volumes:
      - ./eace/dados_eace:/app/dados_eace
      - ./eace/dados_st1:/app/dados_st1
      - ./omada/dados_omada:/app/omada/dados_omada
      - ./omada/dados_st1:/app/omada/dados_st1
      - ./.streamlit:/app/.streamlit
    command: ["python", "-u", "eace_os_exporter.py", "--intervalo", "300"]

  # Site Web (Painel Streamlit)
  streamlit-web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rdo_streamlit_web
    restart: unless-stopped
    ports:
      - "8501:8501"
    environment:
      - TZ=America/Sao_Paulo
    volumes:
      - ./.streamlit:/app/.streamlit
      - ./omada/dados_omada:/app/omada/dados_omada
      - ./omada/dados_st1:/app/omada/dados_st1
      - ./eace/dados_eace:/app/eace/dados_eace
      - ./eace/dados_st1:/app/eace/dados_st1

  # NOC Dashboard (Painel da NASA)
  noc-dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    container_name: rdo_noc_dashboard
    restart: unless-stopped
    environment:
      - TZ=America/Sao_Paulo
      - NOC_API_KEY=${NOC_API_KEY:-""}
    volumes:
      - ./.streamlit:/app/.streamlit

  # Proxy Reverso Caddy
  caddy:
    image: caddy:2-alpine
    container_name: rdo_caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DOMAIN_RDO=${DOMAIN_RDO}
      - DOMAIN_N8N=${DOMAIN_N8N}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config

  # n8n - Automações
  n8n:
    image: docker.n8n.io/n8nio/n8n
    container_name: rdo_n8n
    restart: always
    environment:
      - N8N_HOST=${DOMAIN_N8N}
      - N8N_PORT=5678
      - N8N_PROTOCOL=https
      - NODE_ENV=production
      - WEBHOOK_URL=https://${DOMAIN_N8N}/
      - GENERIC_TIMEZONE=America/Sao_Paulo
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=${N8N_USER:-admin}
      - N8N_BASIC_AUTH_PASSWORD=${N8N_PASSWORD:-senha_forte_n8n}
      - N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS=true
      - N8N_RESTRICT_FILE_ACCESS_TO=/app/.streamlit
    volumes:
      - n8n_data:/home/node/.n8n
      - ./.streamlit:/app/.streamlit

volumes:
  caddy_data:
  caddy_config:
  n8n_data:

